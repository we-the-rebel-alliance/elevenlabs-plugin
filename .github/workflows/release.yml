name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Build the release files
        run: |
          npm run build
          npx plugin-kit conformance --json > conformance-report.json
          tar -czf elevenlabs-dist.tgz dist
          sha256sum elevenlabs-dist.tgz conformance-report.json > SHA256SUMS
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" elevenlabs-dist.tgz conformance-report.json SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
